name: Build and Attach Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - 'V*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Create Secrets / Env Placeholders & Debug Keystore
        run: |
          touch .env
          touch local.properties
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring debug.keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for CI..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "================================================================"
          echo "GOOGLE CLOUD CONSOLE ANDROID OAUTH 2.0 CLIENT CONFIGURATION:"
          echo "Package Name: com.aistudio.nalama.healthdatacompanion"
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:"
          echo "================================================================"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Named Distribution APK
        run: |
          mkdir -p release-artifacts
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found!"
            exit 1
          fi
          cp "$APK_FILE" release-artifacts/NalamaCompanionHealthData.APK
          echo "Prepared APK at release-artifacts/NalamaCompanionHealthData.APK from $APK_FILE"
          ls -la release-artifacts/

      - name: Upload Named APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NalamaCompanionHealthData
          path: release-artifacts/NalamaCompanionHealthData.APK
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/NalamaCompanionHealthData.APK
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
